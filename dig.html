<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dig & Load</title>
<style>
 html,body{margin:0;height:100%;background:#1b2238;overflow:hidden}
 body{display:flex;align-items:center;justify-content:center}
 canvas{display:block;border-radius:10px}
</style></head><body>
<canvas id="c" width="1200" height="675"></canvas>
<script src="sound.js"></script>
<script src="input.js"></script>
<script>
// =====================================================================
//  DIG & LOAD — a 2D construction game (digger, loader, bulldozer, crane)
// =====================================================================
const cv=document.getElementById('c'), g=cv.getContext('2d');
const W=1200, H=675, GROUND=470, CW=4, NC=W/CW+1, BED=H-25, TRUCK_CAP=1400;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function fit(){ const ar=cv.width/cv.height; let w=innerWidth, h=w/ar; if(h>innerHeight){ h=innerHeight; w=h*ar; } cv.style.width=w+'px'; cv.style.height=h+'px'; }
addEventListener('resize',fit); fit();
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rr=(x,y,w,h,r,fill,stroke,lw=3)=>{ g.beginPath(); g.roundRect(x,y,w,h,r); if(fill){ g.fillStyle=fill; g.fill(); } if(stroke){ g.strokeStyle=stroke; g.lineWidth=lw; g.stroke(); } };
const circ=(x,y,r,fill)=>{ g.beginPath(); g.arc(x,y,r,0,7); g.fillStyle=fill; g.fill(); };
const emojiCache={};
function emoji(e,x,y,size){ let c=emojiCache[e]; if(!c){ c=document.createElement('canvas'); c.width=c.height=64; const x2=c.getContext('2d'); x2.font='50px serif'; x2.textAlign='center'; x2.textBaseline='middle'; x2.fillText(e,32,36); emojiCache[e]=c; } g.drawImage(c,x-size/2,y-size/2,size,size); }
function text(t,x,y,size,col='#fff',align='center',weight='bold'){ g.font=`${weight} ${size}px system-ui,sans-serif`; g.textAlign=align; g.textBaseline='middle'; g.fillStyle=col; g.fillText(t,x,y); }
function otext(t,x,y,size,col='#fff',align='center'){ g.font=`bold ${size}px system-ui,sans-serif`; g.textAlign=align; g.textBaseline='middle'; g.lineJoin='round'; g.lineWidth=Math.max(3,size/5); g.strokeStyle='#000a'; g.strokeText(t,x,y); g.fillStyle=col; g.fillText(t,x,y); }
function rumble(gp,ms,s){ try{ gp?.vibrationActuator?.playEffect?.('dual-rumble',{duration:ms,strongMagnitude:s,weakMagnitude:s}).catch(()=>{}); }catch(e){} }

// ---------------- save data ----------------
const SAVE_KEY='digload-save';
const save=Object.assign({best:[],spent:0,bucket:0,engine:0,paints:['yellow'],paint:'yellow',seenGuide:{}}, JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'));
const persist=()=>localStorage.setItem(SAVE_KEY,JSON.stringify(save));
const starsEarned=()=>save.best.reduce((a,b)=>a+(b||0),0);
const starsAvail=()=>starsEarned()-save.spent;
const PAINTS={yellow:['#ffc21a','#b07d00'],orange:['#ff8a1a','#b0520a'],green:['#5ccf4a','#2f8a22'],pink:['#ff6fb5','#b03a78'],blue:['#3fa0ff','#1d5fb0']};
const MACHINES={digger:{name:'Digger',label:'DIGGO',need:0},loader:{name:'Loader',label:'LOADY',need:3},dozer:{name:'Bulldozer',label:'PUSHY',need:5},crane:{name:'Crane',label:'LIFTY',need:8}};
const unlocked=k=>starsEarned()>=MACHINES[k].need;
const SOILS={sand:{c:['#ecc988','#d4a865','#a07a45'],rate:1.4,name:'Sand'},dirt:{c:['#c98a4b','#a86b36','#6e4423'],rate:1,name:'Dirt'},clay:{c:['#c47a55','#9b5236','#5e2c1d'],rate:.7,name:'Clay'}};
const TREASURE_NAMES={'🦴':'a dinosaur bone','🪙':'gold coins','🧸':'a teddy bear','🦖':'a dino skull','💎':'a diamond','👑':'a crown','🏺':'an old vase','⚽':'a lost ball',chest:'the TREASURE CHEST'};

const JOBS=[
 {name:'First Day',     machine:'digger', soil:'sand', goal:{type:'trucks',n:3}, par:150, treasures:3, desc:'Fill 3 trucks with sand.'},
 {name:'Duck Pond',     machine:'digger', soil:'dirt', goal:{type:'pond',x:650,w:120,d:75}, hills:[], par:130, treasures:2, desc:'Dig a pond inside the dotted line.'},
 {name:'Treasure Hunt', machine:'digger', soil:'dirt', goal:{type:'chest'}, chest:{x:640,y:GROUND+115}, par:110, treasures:4, desc:'Dig down at the X and find the treasure chest!'},
 {name:'Loader Time',   machine:'loader', soil:'clay', goal:{type:'trucks',n:4}, hills:[[300,150,90]], par:220, treasures:2, desc:'Use the loader to fill 4 trucks.'},
 {name:'Flatten It',    machine:'dozer',  soil:'dirt', goal:{type:'flat',x1:260,x2:840}, hills:[[430,95,55],[690,110,70]], par:140, treasures:2, desc:'Push the bumps into the pit until the ground is flat.'},
 {name:'Rocks & Pipes', machine:'digger', soil:'clay', goal:{type:'trucks',n:4}, boulders:3, pipe:true, par:240, treasures:3, desc:'Fill 4 trucks. Boulders need 2 hits. Don\'t hit the water pipe!'},
 {name:'Crane Stack',   machine:'crane',  goal:{type:'stack',n:4}, par:100, desc:'Stack 4 blocks inside the flags.'},
 {name:'Night Rain',    machine:'digger', soil:'dirt', goal:{type:'trucks',n:5}, weather:'night', rain:true, boulders:2, pipe:true, par:300, treasures:4, desc:'Fill 5 trucks at night, in the rain. It\'s slippery!'},
];

const GUIDES={
 digger:{title:'🚜 Driving the Digger',lines:[['L-stick ◀ ▶  or  D-pad ◀ ▶','Drive'],['R-stick ▲ ▼  or  D-pad ▲ ▼','Boom up / down'],['L-stick ▲ ▼','Arm out / in'],['✕','Scoop (curl the bucket)'],['□','Dump (open the bucket)'],['R2','Honk the horn! 📯']],
   tips:['Push the bucket into the dirt, then curl it with ✕ to scoop.','Keep the bucket level or the dirt will spill out!','Swing too fast and dirt falls out. Deep holes can tip you over!'],
   keys:'Keyboard: ← → drive · ↑ ↓ boom · W / S arm · Space scoop · X dump · H honk'},
 loader:{title:'🚧 Driving the Loader',lines:[['L-stick ◀ ▶  or  D-pad ◀ ▶','Drive'],['R-stick ▲ ▼  or  D-pad ▲ ▼','Lift arm up / down'],['✕','Tilt bucket back (scoop)'],['□','Tip bucket forward (dump)'],['R2','Honk the horn! 📯']],
   tips:['Drive LEFT into the dirt pile with the bucket low to scoop.','Tilt it back with ✕, lift it high, drive RIGHT to the truck, dump with □.','The loader turns around when you change direction!'],
   keys:'Keyboard: ← → drive · ↑ ↓ arm · Space scoop · X dump · H honk'},
 dozer:{title:'🚛 Driving the Bulldozer',lines:[['L-stick ◀ ▶  or  D-pad ◀ ▶','Drive'],['R-stick ▲ ▼  or  D-pad ▲ ▼','Blade up / down'],['✕  /  □','Blade down / up'],['R2','Honk the horn! 📯']],
   tips:['Lower the blade to the ground and drive forward: dirt piles up in front.','Push the pile to the edge of the pit and it drops in.','Stop at the edge! Driving into the pit tips you over.'],
   keys:'Keyboard: ← → drive · ↑ ↓ blade · H honk'},
 crane:{title:'🏗️ Using the Crane',lines:[['L-stick ◀ ▶  or  D-pad ◀ ▶','Move the hook left / right'],['R-stick ▲ ▼  or  D-pad ▲ ▼','Rope down / up'],['✕','Grab / drop a block'],['R2','Honk! 📯']],
   tips:['Move the hook over a block, lower it, and press ✕ to grab.','Wait for the swinging to stop before you drop it!','Stack blocks inside the green flags.'],
   keys:'Keyboard: ← → move · ↑ ↓ rope · Space grab / drop · H honk'},
};
const GENERAL_GUIDE={title:'⭐ How the game works',lines:[['🚚 Trucks','Fill them up before their timer runs out'],['🦴 Treasure','Dig it up for +100 points'],['🪨 Boulders','Hit them twice, then carry them'],['💧 Pipes','Hitting one = -100 and slippery mud'],['🌧️ Weather','△ changes it in Free Play'],['🔧 Garage','Spend stars on upgrades and paint']],
   tips:['Finish jobs to earn up to 3 ⭐ each.','Stars unlock the Loader (3⭐), Bulldozer (5⭐) and Crane (8⭐).','OPTIONS = pause · L1 / L2 = back to the Game Box menu'],keys:''};
const BATTLE_GUIDE={title:'🆚 2 Player Battle',lines:[['⏱️ 2 minutes','Who can score the most?'],['🚚 Full truck','+300'],['🦴 Treasure','+100'],['💧 Hit a pipe','-100'],['🙈 Tip over','-50']],
   tips:['Player 1 is on the LEFT, Player 2 is on the RIGHT.','Two controllers: one each. One controller: Player 2 uses the keyboard.','Keyboard P2: ← → drive · ↑ ↓ boom · W / S arm · Space scoop · X dump'],keys:''};

// ---------------- per-player input ----------------
const keys={};
addEventListener('keydown',e=>{ keys[e.code]=true; if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup',e=>keys[e.code]=false);
const KB={
 full:{l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',d:'ArrowDown',so:'KeyW',si:'KeyS',curl:'Space',dump:'KeyX',honk:'KeyH',alt:'KeyT'},
 a:{l:'KeyA',r:'KeyD',u:'KeyW',d:'KeyS',so:'KeyQ',si:'KeyE',curl:'KeyF',dump:'KeyG',honk:'KeyR',alt:'KeyT'},
 b:{l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',d:'ArrowDown',so:'KeyI',si:'KeyK',curl:'Period',dump:'Comma',honk:'KeyM',alt:'KeyN'},
};
let lastPad=0; const prevC={};
const connectedPads=()=>[...(navigator.getGamepads?navigator.getGamepads():[])].filter(p=>p&&p.connected);
function assign(slot,twoP){
  const pads=connectedPads();
  if(!twoP){ for(const p of pads) if(p.buttons.some(b=>b.pressed)) lastPad=p.index; return {gp:pads.find(p=>p.index===lastPad)||pads[0]||null,kb:KB.full}; }
  if(pads.length>=2) return slot===0?{gp:pads[0],kb:KB.a}:{gp:pads[1],kb:KB.b};
  if(pads.length===1) return slot===0?{gp:pads[0],kb:null}:{gp:null,kb:KB.full};
  return slot===0?{gp:null,kb:KB.a}:{gp:null,kb:KB.b};
}
function readControls(slot,twoP){
  const {gp,kb}=assign(slot,twoP), n=gp?Input.named(gp):{}, k=c=>!!(kb&&keys[kb[c]]), dz=v=>Math.abs(v||0)<.22?0:v;
  const c={gp,
    drive:clamp(dz(n.lx)+((n.dright||k('r'))?1:0)-((n.dleft||k('l'))?1:0),-1,1),
    boom:clamp(dz(n.ry)+((n.ddown||k('d'))?1:0)-((n.dup||k('u'))?1:0),-1,1),
    stick:clamp(dz(n.ly)+(k('si')?1:0)-(k('so')?1:0),-1,1),
    curl:!!(n.cross||k('curl')), dump:!!(n.square||k('dump')), honk:!!(n.r2||k('honk')), alt:!!(n.triangle||k('alt'))};
  const p=prevC[slot]||{}; c.curlP=c.curl&&!p.curl; c.honkP=c.honk&&!p.honk; c.altP=c.alt&&!p.alt; prevC[slot]=c; return c;
}
// menu buttons (any controller + keyboard)
const mPrev={}; const mb={};
function menuButtons(s){
  const n=s.btn||{};
  const cur={cross:!!(n.cross||keys.Space||keys.Enter||keys.KeyZ),circle:!!(n.circle||keys.KeyQ),triangle:!!(n.triangle||keys.KeyR)};
  for(const k in cur){ mb[k]=cur[k]&&!mPrev[k]; mPrev[k]=cur[k]; }
}

// ---------------- arm definitions ----------------
const ARMS={
  digger:{px:80,py:-120,L1:170,L2:150,bMin:-1.25,bMax:.55,sMin:.15,sMax:2.5,kMin:-2.6,kMax:1.6,scale:1},
  loader:{px:30,py:-100,L1:150,L2:0,bMin:-.95,bMax:.88,sMin:0,sMax:0,kMin:-1.9,kMax:1.9,scale:1.25},
};
const PEBBLES=[...Array(90)].map((_,i)=>({x:(i*137.5)%W,y:GROUND+20+((i*53)%180),r:2+(i%3)}));

// =====================================================================
//  SITE: one player's construction site (terrain, machine, truck, ...)
// =====================================================================
class Site{
  constructor(o){
    Object.assign(this,o);              // machine, job, seed, slot, mode('job'|'free'|'battle'|'demo'), paint
    const R=this.R=rng(o.seed||1);
    const J=this.J=o.job!=null?JOBS[o.job]:null;
    this.soil=SOILS[(J&&J.soil)||'dirt'];
    this.cols=new Float32Array(NC).fill(GROUND);
    this.parts=[]; this.msgs=[]; this.shake=0; this.time=0; this.score=0; this.trucksDone=0; this.found=0;
    this.weather=(J&&J.weather)||'day'; this.rain=!!(J&&J.rain); this.wIdx=0;
    this.boulders=[]; this.treasures=[]; this.blocks=[]; this.pipe=null; this.done=false; this.doneT=0; this.truck=null; this.truckWait=null;
    this.rainDrops=[...Array(140)].map(()=>({x:R()*W,y:R()*H,s:9+R()*5}));
    if(this.machine==='crane') this.setupCrane();
    else{
      const hills=(J&&J.hills!==undefined)?J.hills:this.machine==='loader'?[[300,150,90]]:[[625,120,95]];
      for(const [hx,hw,hh] of hills) this.hill(hx,hw,hh);
      if(this.machine==='dozer') this.pit(940,1210,110);
      const nb=J?(J.boulders||0):(this.mode==='free'||this.mode==='battle'?2:0);
      for(let i=0;i<nb;i++){ const x=470+R()*240; this.boulders.push({x,y:this.surf(x)+28+R()*50,r:24,hp:2,vy:0,cd:0}); }
      this.addTreasures(J?(J.treasures||0):4);
      if(J&&J.chest) this.treasures.push({x:J.chest.x,y:J.chest.y,e:'chest',state:'buried',chest:true});
      if(J&&J.pipe) this.pipe={y:GROUND+62,x1:330,x2:880,burst:0};
      if(this.machine!=='dozer') this.truck=this.newTruck();
    }
    this.workers=[0,1,2].map(i=>({x:140+i*340+R()*60,dir:R()<.5?-1:1,state:'walk',t:0,ph:R()*6}));
    this.m=this.newMachine();
    this.shade=document.createElement('canvas'); this.shade.width=W; this.shade.height=H;
  }
  get mud(){ return this.rain||(this.pipe&&this.pipe.burst>0); }
  surf(x){ return this.cols[clamp(Math.round(x/CW),0,NC-1)]; }
  hill(cx,w,h){ for(let i=0;i<NC;i++){ const d=Math.abs(i*CW-cx); if(d<w) this.cols[i]-=(Math.cos(d/w*Math.PI)+1)/2*h; } }
  pit(x1,x2,d){ for(let i=0;i<NC;i++){ const x=i*CW; if(x>x1&&x<x2) this.cols[i]=GROUND+d*clamp((x-x1)/40,0,1); } }
  addTreasures(n){ const kinds=Object.keys(TREASURE_NAMES).filter(k=>k!=='chest'); for(let i=0;i<n;i++){ const x=400+this.R()*380; this.treasures.push({x,y:Math.max(GROUND,this.surf(x))+32+this.R()*90,e:kinds[Math.floor(this.R()*kinds.length)],state:'buried'}); } }
  setupCrane(){
    this.cols.fill(GROUND); this.blocks=[]; this.zone=[790,960];
    const colors=['#ff5b6e','#3fa0ff','#4be38a','#ffb000','#c77dff','#ff8a1a'];
    for(let i=0;i<6;i++){ const col=i%3,row=Math.floor(i/3),w=84,h=46; this.blocks.push({x:260+col*110,y:GROUND-h/2-row*h,w,h,vx:0,vy:0,c:colors[i],held:false}); }
    if(this.m){ this.m.held=null; }
  }
  newTruck(){ return {x:1500,tx:860,state:'arrive',fill:0,timer:0,max:this.mode==='job'?75*60:0,fullT:0,bounce:0}; }
  newMachine(){
    const k=this.machine;
    const m={kind:k,face:k==='loader'?-1:1,flipT:0,x:k==='dozer'?220:(k==='loader'?620:300),y:GROUND,vx:0,angle:0,tip:0,load:0,rock:null,bA:-.5,sRel:1.4,bRel:-1.0,blade:0,throttle:0,carried:0,
             tx:500,tv:0,ptv:0,L:150,a:0,av:0,held:null,paint:this.paint||save.paint,def:ARMS[k]};
    if(k==='loader'){ m.bA=.2; m.bRel=-.2; }
    return m;
  }
  cap(){ return 380*(1+.25*save.bucket)*(this.machine==='loader'?1.4:1); }
  limits(){ return {digger:[130,410],loader:[130,590],dozer:[140,1010]}[this.machine]; }
  msg(t,col='#fff'){ this.msgs.push({t,col,age:0}); if(this.msgs.length>3) this.msgs.shift(); }
  addScore(n){ this.score=Math.max(0,this.score+n); }
  arm(m){
    const A=m.def, P={x:A.px,y:A.py}, B={x:P.x+Math.cos(m.bA)*A.L1,y:P.y+Math.sin(m.bA)*A.L1};
    const sA=m.bA+m.sRel, S=A.L2?{x:B.x+Math.cos(sA)*A.L2,y:B.y+Math.sin(sA)*A.L2}:B;
    const kA=(A.L2?sA:m.bA)+m.bRel, sc=A.scale, c=Math.cos(kA), s=Math.sin(kA);
    return {P,B,S,sA,kA,T:{x:S.x+(c*60-s*2)*sc,y:S.y+(s*60+c*2)*sc},C:{x:S.x+(c*28-s*14)*sc,y:S.y+(s*28+c*14)*sc}};
  }
  toWorld(m,p){ const c=Math.cos(m.angle),s=Math.sin(m.angle),px=p.x*(m.face||1); return {x:m.x+px*c-p.y*s,y:m.y+px*s+p.y*c}; }
  flip(m,inp){ if((inp<-.3&&m.face>0)||(inp>.3&&m.face<0)){ m.face=Math.sign(inp); m.flipT=10; Sfx.tick(); } if(m.flipT>0) m.flipT--; }

  // ---------- update ----------
  update(c){
    this.gp=c.gp; this.time++;
    const m=this.m;
    if(m.kind==='crane') this.updateCrane(c); else if(m.kind==='dozer') this.updateDozer(c); else this.updateArm(c);
    if(c.honkP){ Sfx.honk(); this.honkBack=30; for(const w of this.workers) if(w.state==='walk'){ w.state='wave'; w.t=60; } }
    if(this.honkBack>0 && --this.honkBack===0 && this.truck && this.truck.state==='wait') Sfx.truckHorn();
    if(c.altP && this.mode==='free'){ if(m.kind==='crane'){ this.setupCrane(); this.msg('New blocks!'); } else this.cycleWeather(); }
    if(m.kind!=='crane'){
      this.updateTruck();
      if(!this.truck && this.truckWait!=null && m.kind!=='dozer' && --this.truckWait<=0 && !this.done){ this.truck=this.newTruck(); this.truckWait=null; }
      this.relax(); this.updateBoulders(); this.updateTreasures(); this.updatePipe();
      if(this.mode!=='job' && !this.treasures.some(t=>t.state==='buried'||t.state==='exposed')) this.addTreasures(3);
    }
    this.updateParts(); this.updateWorkers();
    if(this.rain) for(const d of this.rainDrops){ d.y+=d.s; d.x-=2; if(d.y>H){ d.y=-10; d.x=Math.random()*W+40; } }
    // exhaust smoke
    if(m.kind!=='crane' && !m.tip && this.time%(m.throttle>.1?5:14)===0){ const e=this.toWorld(m,{x:-56,y:-168}); this.parts.push({kind:'smoke',x:e.x,y:e.y,vx:-.3,vy:-.8,life:50,r:5}); }
    this.shake*=.85;
    for(const ms of this.msgs) ms.age++; this.msgs=this.msgs.filter(ms=>ms.age<150);
    if(this.mode==='job' && !this.done) this.checkGoal();
    if(this.done) this.doneT++;
  }
  cycleWeather(){ const L=[['day',false,'☀️ Sunny day'],['sunset',false,'🌅 Sunset'],['night',false,'🌙 Night time'],['day',true,'🌧️ Rainy day'],['night',true,'⛈️ Stormy night']]; this.wIdx=(this.wIdx+1)%L.length; [this.weather,this.rain]=L[this.wIdx]; this.msg(L[this.wIdx][2]); }
  drive(inp,sp){
    const m=this.m;
    if(m.tip){ m.tip++; m.angle=lerp(m.angle,m.tipDir*1.3,.08); m.y+=.6; if(m.tip===8){ Sfx.crash(); this.shake=14; rumble(this.gp,500,1); }
      if(m.tip>100){ this.msg('Oops! Tipped over! 🙈 -50','#ffb3b3'); this.addScore(-50); const k=m.kind; Object.assign(m,this.newMachine(),{kind:k}); } return; }
    m.vx+=inp*.32*sp; m.vx*=this.mud?.955:.86; if(this.mud) m.vx+=Math.sin(m.angle)*.12;
    m.vx=clamp(m.vx,-3.4*sp,3.4*sp);
    const [lo,hi]=this.limits();
    m.throttle=Math.abs(inp);
    let nx=clamp(m.x+m.vx,lo,hi), [ang,cy]=this.pose(nx);
    // too steep to climb? stop (wheels spin) instead of tipping
    if((m.vx>0&&ang<-.45)||(m.vx<0&&ang>.45)){ nx=m.x; m.vx=0; [ang,cy]=this.pose(nx); m.blocked=true; if(this.time%8===0) this.dust(m.x+(inp>0?90:-90),m.y); } else m.blocked=false;
    m.x=nx; if(m.x===lo||m.x===hi) m.vx=0;
    if(Math.abs(ang)>.6){ m.tip=1; m.tipDir=Math.sign(ang); m.load=0; m.rock=null; return; }
    m.angle=lerp(m.angle,ang,.25); m.y=lerp(m.y,cy,.35);
  }
  pose(x){ const half=85, hL=this.surf(x-half), hR=this.surf(x+half), hM=this.surf(x);
    if(hM>=(hL+hR)/2-1) return [Math.atan2(hR-hL,2*half),(hL+hR)/2];
    const sL=(hM-hL)/half, sR=(hR-hM)/half; return [Math.atan(hM+sL*half<=hR?sL:sR),hM]; }
  updateArm(c){
    const m=this.m, A=m.def, sp=1+.2*save.engine;
    if(m.kind==='loader'&&!m.tip) this.flip(m,c.drive);
    this.drive(c.drive,sp); if(m.tip) return;
    m.bA=clamp(m.bA+c.boom*.022,A.bMin,A.bMax);
    if(A.L2) m.sRel=clamp(m.sRel+c.stick*.03,A.sMin,A.sMax);
    if(A.L2 && m.bA+m.sRel<-.35) m.sRel=-.35-m.bA;      // stick can't fold up past straight up

  b.fillStyle=hill; b.beginPath(); b.moveTo(0,GROUND); for(let x=0;x<=W;x+=20) b.lineTo(x,GROUND-60-Math.sin(x/160)*30-Math.sin(x/53)*8); b.lineTo(W,GROUND); b.fill();

  for(const [x,h,w] of bld){ b.fillStyle=weather==='night'?'#2b3254':weather==='sunset'?'#a08aa0':'#b9c7d8'; b.fillRect(x,GROUND-60-h,w,h+40);
    for(let yy=GROUND-50-h;yy<GROUND-70;yy+=18) for(let xx=x+8;xx<x+w-8;xx+=14){ b.fillStyle=weather==='night'?((xx*yy)%7<3?'#ffe68a':'#3a4268'):'#9fb0c4'; b.fillRect(xx,yy,7,9); } }

const game={screen:'title',sel:0,sites:[],twoP:false,paused:false,pauseSel:0,guidePages:[],guidePage:0,after:null,battleMachines:['digger','digger'],battleTime:0};
const demo=new Site({machine:'digger',mode:'demo',seed:7});
let navLock=false;
function nav(s){ let d=0; if(s.down||s.right) d=1; if(s.up||s.left) d=-1; if(!d){ navLock=false; return 0; } if(navLock) return 0; navLock=true; Sfx.move(); return d; }
function navXY(s){ let dx=0,dy=0; if(s.left) dx=-1; else if(s.right) dx=1; else if(s.up) dy=-1; else if(s.down) dy=1; if(!dx&&!dy){ navLock=false; return [0,0]; } if(navLock) return [0,0]; navLock=true; Sfx.move(); return [dx,dy]; }
function setCanvas(w){ if(cv.width!==w){ cv.width=w; cv.height=H; fit(); } }
function showGuide(pages,after){ game.guidePages=pages; game.guidePage=0; game.after=after; game.screen='guide'; }
function startJob(i){
  const J=JOBS[i]; game.twoP=false; game.mode='job'; game.job=i;
  game.sites=[new Site({machine:J.machine,job:i,seed:100+i,slot:0,mode:'job'})];
  game.screen='play'; game.paused=false; setCanvas(W);
}
function startFree(mk){ game.twoP=false; game.mode='free'; game.freeMachine=mk; game.sites=[new Site({machine:mk,seed:Math.floor(Math.random()*1e6),slot:0,mode:'free'})]; game.screen='play'; game.paused=false; setCanvas(W); }
function startBattle(){
  game.twoP=true; game.mode='battle'; const seed=Math.floor(Math.random()*1e6);
  const p1=save.paint, p2=p1==='blue'?'orange':'blue';
  game.sites=[0,1].map(i=>new Site({machine:game.battleMachines[i],seed,slot:i,mode:'battle',paint:i?p2:p1}));
  game.battleTime=120*60; game.screen='play'; game.paused=false; setCanvas(W*2);
}
function endPlay(){ Sfx.engineStop(); setCanvas(W); }
const TITLE_ITEMS=[['🏗️','Jobs','Finish jobs, earn stars'],['🌤️','Free Play','No timer, just dig!'],['🆚','2 Player Battle','Compete side by side'],['🔧','Garage','Upgrades & paint'],['📖','How to Play','Controls & tips']];

function update(){
  const s=Input.poll(); menuButtons(s);
  const sc=game.screen;
  if(sc==='title'){
    game.sel=(game.sel+nav(s)+TITLE_ITEMS.length)%TITLE_ITEMS.length;
    demo.time++; const t=demo.time/60; demo.m.bA=-.5+Math.sin(t*.9)*.25; demo.m.sRel=1.3+Math.sin(t*.9)*.35; demo.m.bRel=-.8+Math.sin(t*.9+1)*.5; demo.m.tipPos=demo.toWorld(demo.m,demo.arm(demo.m).T); demo.updateWorkers();
    if(mb.cross){ Sfx.select(); [()=>{game.screen='jobs';game.sel=0;},()=>{game.screen='free';game.sel=0;},()=>{game.screen='battleSetup';},()=>{game.screen='garage';game.sel=0;},()=>showGuide([GENERAL_GUIDE,GUIDES.digger,GUIDES.loader,GUIDES.dozer,GUIDES.crane,BATTLE_GUIDE],()=>{game.screen='title';})][game.sel](); }
  }
  else if(sc==='jobs'){
    const [dx,dy]=navXY(s); game.sel=clamp(game.sel+dx+dy*4,0,JOBS.length-1);
    if(mb.circle){ game.screen='title'; game.sel=0; }
    if(mb.cross){ const i=game.sel, lock=jobLock(i); if(lock) { Sfx.clunk(); } else { Sfx.select(); const J=JOBS[i]; showGuide([GUIDES[J.machine],{title:`Job ${i+1}: ${J.name}`,lines:[],big:J.desc,tips:['Get it done fast for 3 ⭐!'],keys:''}],()=>startJob(i)); } }
  }
  else if(sc==='free'){
    const list=Object.keys(MACHINES); game.sel=(game.sel+nav(s)+list.length)%list.length;
    if(mb.circle){ game.screen='title'; game.sel=1; }
    if(mb.cross){ const mk=list[game.sel]; if(!unlocked(mk)) Sfx.clunk(); else { Sfx.select(); showGuide([GUIDES[mk]],()=>startFree(mk)); } }
  }
  else if(sc==='battleSetup'){
    const opts=['digger','loader'].filter(unlocked);
    for(let i=0;i<2;i++){ const c=readControls(i,true); const k='bsel'+i; if(Math.abs(c.drive)>.5){ if(!game[k]){ game[k]=true; const cur=opts.indexOf(game.battleMachines[i]); game.battleMachines[i]=opts[(cur+(c.drive>0?1:-1)+opts.length*2)%opts.length]||'digger'; Sfx.move(); } } else game[k]=false; }
    if(mb.circle){ game.screen='title'; game.sel=2; }
    if(mb.cross){ Sfx.select(); showGuide([BATTLE_GUIDE,GUIDES[game.battleMachines[0]]],startBattle); }
  }
  else if(sc==='garage'){
    const items=garageItems(); game.sel=(game.sel+nav(s)+items.length)%items.length;
    if(mb.circle){ game.screen='title'; game.sel=3; }
    if(mb.cross){ const it=items[game.sel]; if(it.act()) Sfx.select(); else Sfx.clunk(); persist(); }
  }
  else if(sc==='guide'){
    if(mb.cross){ Sfx.select(); game.guidePage++; if(game.guidePage>=game.guidePages.length) game.after(); }
    if(mb.circle){ if(game.guidePage>0) game.guidePage--; else { game.screen='title'; } }
  }
  else if(sc==='play') updatePlay(s);
  else if(sc==='result'){
    game.resT++;
    if(game.mode==='job'){ if(mb.cross){ const n=game.job+1; if(n<JOBS.length&&!jobLock(n)){ const J=JOBS[n]; showGuide([GUIDES[J.machine],{title:`Job ${n+1}: ${J.name}`,lines:[],big:J.desc,tips:['Get it done fast for 3 ⭐!'],keys:''}],()=>startJob(n)); } else { game.screen='jobs'; game.sel=game.job; } }
      if(mb.triangle) startJob(game.job); if(mb.circle){ game.screen='jobs'; game.sel=game.job; } }
    else { if(mb.cross) startBattle(); if(mb.circle){ game.screen='title'; game.sel=2; } }
  }
}
function jobLock(i){ const J=JOBS[i]; if(i>0&&!save.best[i-1]) return 'Finish the job before'; if(!unlocked(J.machine)) return `Needs ${MACHINES[J.machine].need} ⭐`; return null; }
function garageItems(){
  const L=[];
  L.push({icon:'🪣',name:'Bigger Bucket',info:`Level ${save.bucket} / 3`,cost:save.bucket<3?3:null,act:()=>{ if(save.bucket<3&&starsAvail()>=3){ save.bucket++; save.spent+=3; return true; } return false; }});
  L.push({icon:'⚙️',name:'Faster Engine',info:`Level ${save.engine} / 3`,cost:save.engine<3?3:null,act:()=>{ if(save.engine<3&&starsAvail()>=3){ save.engine++; save.spent+=3; return true; } return false; }});
  for(const p in PAINTS){ const own=save.paints.includes(p); L.push({icon:'🎨',paint:p,name:p[0].toUpperCase()+p.slice(1)+' paint',info:save.paint===p?'✅ Using':own?'Owned: press ✕ to use':'',cost:own?null:1,act:()=>{ if(own){ save.paint=p; return true; } if(starsAvail()>=1){ save.paints.push(p); save.paint=p; save.spent+=1; return true; } return false; }}); }
  return L;
}
function updatePlay(s){
  if(game.paused){
    game.pauseSel=(game.pauseSel+nav(s)+2)%2;
    if(mb.cross){ if(game.pauseSel===0) game.paused=false; else { endPlay(); game.screen='title'; game.sel=0; } }
    if(mb.circle||s.startPressed) game.paused=false;
    return;
  }
  if(s.startPressed){ game.paused=true; game.pauseSel=0; Sfx.pause(); Sfx.engineStop(); return; }
  game.sites.forEach((site,i)=>{ const c=readControls(i,game.twoP); site.update(c); Sfx.engine(i,Math.min(1,site.m.throttle||0)); });
  if(game.mode==='battle'){
    game.battleTime--;
    if(game.battleTime>0&&game.battleTime<=600&&game.battleTime%60===0) Sfx.tick();
    if(game.battleTime<=0){ endPlay(); game.screen='result'; game.resT=0; Sfx.win(); }
  }
  if(game.mode==='job'){ const st=game.sites[0]; if(st.done&&st.doneT>150){
    const J=JOBS[game.job], t=st.time/60, stars=t<=J.par?3:t<=J.par*1.6?2:1, before=starsEarned(), prevBest=save.best[game.job]||0;
    save.best[game.job]=Math.max(prevBest,stars); persist();
    game.result={stars,t,score:st.score,newBest:stars>prevBest,unlockedNow:Object.keys(MACHINES).filter(k=>MACHINES[k].need>before&&MACHINES[k].need<=starsEarned())};
    endPlay(); game.screen='result'; game.resT=0; } }
}
